name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch makes any in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # AGP 8.7.3 and sourceCompatibility=VERSION_17 both require JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-latest already ships an Android SDK with cmdline-tools on PATH, so
      # android-actions/setup-android is not needed. That action has been the
      # flaky step; using sdkmanager directly removes it from the dependency chain.
      - name: Accept SDK licences
        run: |
          yes | sdkmanager --licenses > /dev/null || true

      - name: Install SDK platform and build-tools
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # settings.gradle.kts lists mavenCentral() ahead of gradlePluginPortal()
      # because the plugin portal is unreachable from the corporate network.
      # GitHub-hosted runners can reach both, so no special-casing is needed.
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delish-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
