name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch makes any in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assemble-debug:
    name: Assemble debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      # AGP 8.7.3 and sourceCompatibility=VERSION_17 both require JDK 17.
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # ubuntu-24.04 ships an Android SDK but does NOT put cmdline-tools on PATH,
      # so a bare `sdkmanager` call dies with exit 127. Locate it explicitly and
      # fail loudly here rather than letting a missing tool surface later as a
      # confusing Gradle error.
      - name: Locate cmdline-tools
        run: |
          set -euo pipefail
          for root in "${ANDROID_SDK_ROOT:-}" "${ANDROID_HOME:-}" /usr/local/lib/android/sdk; do
            [ -n "$root" ] || continue
            if [ -x "$root/cmdline-tools/latest/bin/sdkmanager" ]; then
              echo "Found sdkmanager under $root"
              echo "$root" >> "$GITHUB_ENV"
              echo "$root/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
              exit 0
            fi
          done
          echo "::error::sdkmanager not found; searched ANDROID_SDK_ROOT, ANDROID_HOME, /usr/local/lib/android/sdk"
          exit 1

      # No `|| true` here. An earlier version had it, which silently turned
      # "sdkmanager: command not found" into a green step and hid the real fault.
      - name: Accept SDK licences
        run: yes | sdkmanager --licenses > /dev/null

      - name: Install SDK platform and build-tools
        run: |
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # settings.gradle.kts lists mavenCentral() ahead of gradlePluginPortal()
      # because the plugin portal is unreachable from the corporate network.
      # GitHub-hosted runners can reach both, so no special-casing is needed.
      - name: Assemble debug APK
        run: ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: delish-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
          if-no-files-found: error
